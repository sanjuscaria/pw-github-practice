name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - dev
          - stage

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Tells GitHub which Environment's secrets to load (defaults to 'qa' on push/PR)
    environment: ${{ github.event.inputs.environment || 'qa' }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}
        BASE_URL: ${{ secrets.BASE_URL }}
        HRM_USERNAME: ${{ secrets.HRM_USERNAME }}
        HRM_PASSWORD: ${{ secrets.HRM_PASSWORD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ github.event.inputs.environment || 'qa' }}
        path: playwright-report/
        retention-days: 30
